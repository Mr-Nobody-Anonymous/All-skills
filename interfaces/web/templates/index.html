<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All-Skills Platform</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 800px; padding: 2rem; }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p.subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .chat-box { background: #1e293b; border-radius: 1rem; padding: 1.5rem; min-height: 400px; display: flex; flex-direction: column; gap: 1rem; }
    .input-row { display: flex; gap: 0.75rem; margin-top: 1rem; }
    input[type=text] { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem 1rem; color: #e2e8f0; font-size: 1rem; outline: none; }
    input[type=text]:focus { border-color: #6366f1; }
    button { background: #6366f1; color: white; border: none; border-radius: 0.5rem; padding: 0.75rem 1.5rem; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #4f46e5; }
    .message { padding: 0.75rem 1rem; border-radius: 0.5rem; max-width: 85%; }
    .message.user { background: #334155; align-self: flex-end; }
    .message.assistant { background: #1e3a5f; align-self: flex-start; }
    .messages { flex: 1; display: flex; flex-direction: column; gap: 0.75rem; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>All-Skills Platform</h1>
    <p class="subtitle">Universal Multimodal Skill Operating System</p>
    <div class="chat-box">
      <div class="messages" id="messages">
        <div class="message assistant">Hello! I'm the All-Skills assistant. Ask me anything or give me a command.</div>
      </div>
      <div class="input-row">
        <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
  <script>
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      input.value = '';
      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({query: text})
        });
        const data = await res.json();
        addMessage(data.result?.text || JSON.stringify(data.result) || 'Done.', 'assistant');
      } catch (e) {
        addMessage('Error: ' + e.message, 'assistant');
      }
    }
    function addMessage(text, role) {
      const el = document.createElement('div');
      el.className = 'message ' + role;
      el.textContent = text;
      const msgs = document.getElementById('messages');
      msgs.appendChild(el);
      msgs.scrollTop = msgs.scrollHeight;
    }
  </script>
</body>
</html>
