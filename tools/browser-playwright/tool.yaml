tool_id: browser-playwright
version: "2.0.0"
description: "Full headless browser automation, screenshots, and interaction"
capabilities: [browser:interact, browser:screenshot]
permissions:
  mode: "domain-allowlist"
risk_level: "medium"
platforms: ["linux", "windows", "macos"]
healthcheck:
  command: "echo healthcheck"
  timeout_sec: 5
