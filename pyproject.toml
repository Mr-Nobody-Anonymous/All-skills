[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skills-library"
version = "3.0.0"
description = "Dependency-light Agent Skills registry, router, validator, quality scoring, lifecycle, chains, and CLI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
agent-skills = "skills.cli:main"
all-skills = "scratch_priority_import.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "scratch_priority_import" = "scratch_priority_import"}

[tool.setuptools.packages.find]
where = ["src", "."]

[tool.black]
line-length = 100
target-version = ['py39', 'py310']

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

