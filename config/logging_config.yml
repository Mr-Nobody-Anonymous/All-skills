# ==============================================================================
# All-Skills Logging Configuration
# ==============================================================================

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] [%(name)s]: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s [%(levelname)s] [%(name)s:%(lineno)d] [%(threadName)s]: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: data/logs/system.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

loggers:
  scratch_priority_import:
    level: INFO
    handlers: [console]
    propagate: false

  core:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]
