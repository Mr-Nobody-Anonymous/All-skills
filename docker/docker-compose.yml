# All-Skills — containerised CLI
#
#   docker compose -f docker/docker-compose.yml up --build            # build + run `doctor`
#   docker compose -f docker/docker-compose.yml run --rm all-skills search "kubernetes"
#   docker compose -f docker/docker-compose.yml run --rm all-skills route "review my PR"
#
# Optional credentials for integrations are read from ../.env (copy .env.example).

name: all-skills

services:
  all-skills:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: all-skills:local
    env_file:
      - path: ../.env
        required: false
    stdin_open: true
    tty: true
