version: "3.8"

services:
  all-skills-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: all-skills-runtime
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - ../data:/app/data
      - ../config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - ALL_SKILLS_ENV=production
