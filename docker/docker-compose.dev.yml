version: "3.8"

services:
  all-skills-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: all-skills-dev
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - ..:/app
    environment:
      - PYTHONUNBUFFERED=1
      - ALL_SKILLS_ENV=development
      - DEBUG=true
    command: ["python", "-m", "unittest", "discover", "tests"]
