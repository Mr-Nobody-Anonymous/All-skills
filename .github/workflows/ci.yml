name: CI / Quality & Security Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate Schemas & Test Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@39cd14951b08e74b54015eac00f074f16fc18230 # v5.1.1
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies & Verify Package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 1. Run Schema Validation
        run: python scripts/validate_schema.py

      - name: 2. Run Registry & Statistics Integrity Verification
        run: python scripts/verify_registry_integrity.py

      - name: 3. Verify Stats Synchronization
        run: python scripts/compute_stats.py --verify

      - name: 4. Verify Architecture Baselines
        run: python scripts/generate_baselines.py --verify

      - name: 5. Run Platform Test Suite
        run: python scripts/skills/skills.py test

      - name: 6. Run Execution Runtime, Security Gate & Adapter Conformance Unit Tests
        run: python -m unittest tests/test_runtime.py tests/test_security_gates.py tests/test_adapters_conformance.py

      - name: 7. Run Behavioral, Routing & Adversarial Evals
        run: python scripts/run_evals.py

      - name: 8. Run Skill Library Doctor Diagnostics
        run: python scripts/skills/skills.py doctor

  security-scan:
    name: Static Security & Prompt Injection Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@39cd14951b08e74b54015eac00f074f16fc18230 # v5.1.1
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & Verify Package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Skill Security Scan
        run: python scripts/scan_skills_security.py

      - name: Run 11-Layer Platform Doctor
        run: python scripts/allskills.py doctor --full
