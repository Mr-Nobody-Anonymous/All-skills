name: CI / Quality & Security Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Validate Schemas & Test Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Schema Validation
        run: python scripts/validate_schema.py

      - name: Run Platform Test Suite
        run: python scripts/skills/skills.py test

      - name: Run Skill Library Doctor Diagnostics
        run: python scripts/skills/skills.py doctor

  security-scan:
    name: Static Security & Prompt Injection Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Skill Security Scan
        run: python scripts/scan_skills_security.py
