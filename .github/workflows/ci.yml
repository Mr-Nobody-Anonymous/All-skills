name: CI

# Single consolidated pipeline. It replaces the former ci.yml, test.yml,
# validate.yml, validate-skills.yml, skill-integrity.yml and registry.yml
# workflows, which all repeated the same install + checks. Every command they
# ran is preserved in the jobs below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev tools (pinned by requirements-dev.txt)
        run: python -m pip install -c requirements-dev.txt -e ".[dev]"

      - name: Ruff (correctness lint)
        run: ruff check --output-format=github .

      - name: mypy (src/skills)
        run: mypy

      - name: Lint GitHub Actions workflows (actionlint + shellcheck)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-2025
            python-version: "3.12"
          - os: macos-15
            python-version: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with test extras (pinned by requirements-dev.txt)
        run: python -m pip install -c requirements-dev.txt -e ".[test]"

      # Fails below the coverage floor in pyproject.toml ([tool.coverage.report] fail_under).
      - name: pytest with coverage
        run: >-
          python -m pytest tests scratch_priority_import/tests
          --cov --cov-report=term --cov-report=xml

      - name: Platform test suite (No-Regression Gate 2)
        run: python scripts/skills/skills.py test

      - name: Publish coverage summary
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: |
          {
            echo "### Coverage — src/skills (Python ${{ matrix.python-version }})"
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  validate:
    name: Validate library & integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (pinned by requirements-dev.txt)
        run: python -m pip install -c requirements-dev.txt -e .

      # Canonical + active skills must pass the JSON Schema; catalog violations
      # may only go down (102 third-party files lack valid frontmatter today).
      - name: Frontmatter schemas (JSON Schema)
        run: python scripts/validate_schema.py --catalog --max-catalog-errors 102

      - name: SkillHub & multi-agent specifications
        run: python scripts/validate_skillhub_spec.py

      - name: Skill structure & conflicts
        run: python scripts/skills/skills.py validate

      - name: Registry & statistics integrity
        run: python scripts/verify_registry_integrity.py

      - name: Stats synchronisation
        run: |
          python scripts/compute_stats.py --verify
          python scripts/generate_readme_stats.py --verify

      - name: Architecture baselines
        run: python scripts/generate_baselines.py --verify

      - name: Registry & dependencies are current
        run: python scripts/refresh_registry.py --check

      - name: Lockfile hashes
        run: python scripts/skills/skills.py lock --verify

      - name: Behavioral, routing & adversarial evals
        run: python scripts/run_evals.py

      - name: Doctor (lifecycle, quality, conflicts, deps)
        run: python scripts/skills/skills.py doctor

      - name: 11-layer platform doctor
        run: python scripts/allskills.py doctor --full

      - name: Resolve named chains
        run: |
          for chain in deep-research anti-procrastination code-review-flow; do
            python scripts/skills/skills.py chain "$chain" | grep -q "Steps:" \
              || { echo "::error::chain '$chain' did not resolve"; exit 1; }
          done

  package:
    name: Build & verify package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist & wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*

      # Runs outside the checkout so the wheel (not the source tree) is imported.
      - name: Smoke-test the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-venv/bin/all-skills --version
          wheel-venv/bin/python -c "import skills, scratch_priority_import; print(skills.__version__)"
          # Outside any workspace the CLI must fail clearly instead of guessing.
          if wheel-venv/bin/all-skills list; then echo "::error::expected a missing-workspace error"; exit 1; fi
          # With --workspace it runs that workspace's full CLI ...
          wheel-venv/bin/all-skills --workspace "$GITHUB_WORKSPACE" route "review my pull request" --top-k 1
          # ... and the built-in commands when the workspace only has skills/.
          mkdir -p ws && cp -r "$GITHUB_WORKSPACE/skills" ws/
          ALL_SKILLS_WORKSPACE="$PWD/ws" wheel-venv/bin/all-skills list

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build and smoke-test the npm package (clean install outside the checkout)
        run: |
          npm pack --pack-destination dist
          python -m pip install -r requirements.txt
          mkdir -p "$RUNNER_TEMP/npm-project"
          cd "$RUNNER_TEMP/npm-project" || exit 1
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/dist/*.tgz
          npx allskills --help
          npx allskills profile list
          npx allskills search terraform --json --limit 1
          npx allskills lock --verify
          npx allskills doctor --full

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < docker/Dockerfile

      - name: Validate compose files
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose -f docker/docker-compose.dev.yml config --quiet

      - name: Build image
        run: docker build -f docker/Dockerfile -t all-skills:ci .

      - name: Smoke-test image
        run: |
          test "$(docker run --rm --entrypoint id all-skills:ci -u)" != "0"
          docker run --rm all-skills:ci
          docker run --rm all-skills:ci route "review my pull request" --top-k 1
