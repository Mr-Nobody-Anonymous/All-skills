name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skill-scan:
    name: Skill security & prompt-injection scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e .

      - name: Static security scan (strict)
        run: python scripts/skills/skills.py scan --strict

      - name: Prompt-injection & behavioral security scan
        run: python scripts/scan_skills_security.py --strict

  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # list the commits of a pull request
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Scans only the commits introduced by each push / pull request, using
      # the default ruleset extended by .gitleaks.toml. No licence is required
      # for repositories owned by a personal account.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Dependency review needs the repository's Dependency graph (Settings →
      # Code security). Until it is enabled the review is skipped with a notice
      # instead of failing every pull request; it activates automatically after.
      - name: Check that the dependency graph is enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh api "repos/$REPO/dependency-graph/compare/$BASE_SHA...$HEAD_SHA" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Dependency review skipped::Enable the Dependency graph in Settings > Code security to activate dependency review."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Review dependency changes for known vulnerabilities
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
