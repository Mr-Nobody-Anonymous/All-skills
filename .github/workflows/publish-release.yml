name: Release

# Creates a GitHub release named after the version in package.json.
#   - Manually: Actions → Release → "Run workflow"
#   - Or by pushing a tag that matches package.json:  git tag v3.0.0 && git push origin v3.0.0
# The quality gates run again, the Python sdist/wheel and the npm tarball are
# built and install-tested outside the checkout, then attached to the release.
#
# Registry publishing is opt-in (repository variables, Settings → Variables):
#   PUBLISH_TO_PYPI=true  — PyPI Trusted Publishing (configure the project on PyPI first)
#   PUBLISH_TO_NPM=true   — npm, using the NPM_TOKEN repository secret

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Package & publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the tag and GitHub release
      id-token: write # PyPI Trusted Publishing and npm provenance (only used when opted in)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install package & build tools (pinned)
        run: python -m pip install -c requirements-dev.txt -e ".[test]" build twine

      - name: Verify quality gates
        run: |
          python scripts/validate_schema.py
          python scripts/validate_skillhub_spec.py
          python scripts/run_evals.py
          python scripts/skills/skills.py test
          python -m pytest tests scratch_priority_import/tests -q -p no:cacheprovider

      - name: Resolve release version
        id: version
        run: |
          VERSION="v$(python -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build distributions
        run: |
          python -m build
          twine check --strict dist/*
          mkdir -p npm-dist && npm pack --pack-destination npm-dist

      - name: Install-test the artifacts outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-venv/bin/all-skills --version
          wheel-venv/bin/all-skills --workspace "$GITHUB_WORKSPACE" doctor
          mkdir npm-project && cd npm-project && npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/npm-dist/*.tgz
          npx allskills --help
          npx allskills doctor --full

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: All-Skills ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*
            npm-dist/*

      - name: Publish to PyPI (opt-in)
        if: vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Publish to npm (opt-in)
        if: vars.PUBLISH_TO_NPM == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm-dist/*.tgz --provenance --access public
