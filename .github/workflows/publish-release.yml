name: Publish & Release Automation

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "skills/**"
      - ".agents/skills/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Package & Tag Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@39cd14951b08e74b54015eac00f074f16fc18230 # v5.1.1
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies & Verify Package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify Quality Gates
        run: |
          python scripts/validate_schema.py
          python scripts/validate_skillhub_spec.py
          python scripts/run_evals.py

      - name: Extract Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create Git Tag and GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "All-Skills ${{ steps.pkg_version.outputs.version }}"
          tag_name: ${{ steps.pkg_version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
