name: Release

# Creates a GitHub release named after the version in package.json.
#   - Manually: Actions → Release → "Run workflow"
#   - Or by pushing a tag that matches package.json:  git tag v3.0.0 && git push origin v3.0.0
# The quality gates run again before anything is published, and the built
# Python sdist/wheel are attached to the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Package & publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the tag and GitHub release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package & build tools
        run: python -m pip install -e . build twine

      - name: Verify quality gates
        run: |
          python scripts/validate_schema.py
          python scripts/validate_skillhub_spec.py
          python scripts/run_evals.py
          python scripts/skills/skills.py test

      - name: Resolve release version
        id: version
        run: |
          VERSION="v$(python -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        run: |
          python -m build
          twine check --strict dist/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: All-Skills ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
