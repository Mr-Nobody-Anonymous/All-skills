name: registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  registry-current:
    name: Check Registry & Dependencies Current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@39cd14951b08e74b54015eac00f074f16fc18230 # v5.1.1
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & Verify Package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check registry + deps are current
        run: python scripts/refresh_registry.py --check