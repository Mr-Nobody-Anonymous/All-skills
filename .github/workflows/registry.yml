name: registry

on:
  push:
    branches: [main]
  pull_request:

jobs:
  registry-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check registry + deps are current
        run: python scripts/refresh_registry.py --check