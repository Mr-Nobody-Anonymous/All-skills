name: 💡 Feature Request
description: Suggest an improvement to the CLI, runtime, router, adapters or tooling
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for the platform itself? Describe it below.
        To propose a **new skill**, use the **Propose New Skill** template instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Include example commands or APIs if you can.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI (`all-skills` / `scripts/skills/skills.py`)
        - Router & intent matching
        - Execution runtime & policy engine
        - Harness adapters (Claude Code, Cursor, Codex, ...)
        - Security scanning
        - Documentation
        - CI / developer tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
