# Gitleaks configuration — used by .github/workflows/security.yml and by
# `gitleaks git` / `gitleaks dir` locally. Extends the default ruleset.
# (Legacy [allowlist] syntax: compatible with the Gitleaks 8.24.x bundled by
# gitleaks-action v3.)

title = "All-Skills Gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Generated integrity artefacts and historical test fixtures"
paths = [
  '''(^|/)skills\.lock$''',
  '''(^|/)awesome_skills\.lock$''',
  '''(^|/)baselines/[^/]+/file_hashes\.json$''',
]
commits = [
  "7854453571ca46e58823e2959cad7f63d41a4759",
]
